<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Nived Sunil" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c150b"/>
      <stop offset="0.55" stop-color="#16240f"/>
      <stop offset="1" stop-color="#0c150b"/>
    </linearGradient>

    <!-- gold with moving shimmer -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.2" stop-color="#E6C65C"/>
      <stop offset="0.4" stop-color="#FBF1C0"/>
      <stop offset="0.6" stop-color="#D4AF37"/>
      <stop offset="0.8" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#E6C65C"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-900 0" to="900" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8DA242" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8DA242"/>
      <stop offset="1" stop-color="#8DA242" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.1  0 0.8 0 0 0.06  0 0 0.2 0 0  0 0 0 0.55 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="258" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="20" fill="none" stroke="#D4AF37" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="12" y="12" width="876" height="236" rx="14" fill="none" stroke="#8DA242" stroke-opacity="0.45" stroke-width="1"/>

  <!-- corner ornaments -->
  <g fill="#D4AF37">
    <rect x="26" y="26" width="7" height="7" transform="rotate(45 29.5 29.5)"/>
    <rect x="866" y="26" width="7" height="7" transform="rotate(45 869.5 29.5)"/>
    <rect x="26" y="226" width="7" height="7" transform="rotate(45 29.5 229.5)"/>
    <rect x="866" y="226" width="7" height="7" transform="rotate(45 869.5 229.5)"/>
  </g>

  <!-- top tagline -->
  <text x="450" y="58" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="9" fill="#8DA242" opacity="0">
    PORTFOLIO
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="450" y="138" text-anchor="middle" font-family="'Playfair Display','Didot','Bodoni MT',Georgia,'Times New Roman',serif" font-size="76" font-weight="700" letter-spacing="10" fill="url(#gold)" filter="url(#soft)" opacity="0">
    NIVED SUNIL
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- ornamental divider -->
  <rect x="150" y="163" width="270" height="1.5" fill="url(#rule)"/>
  <rect x="480" y="163" width="270" height="1.5" fill="url(#rule)"/>
  <rect x="444" y="157" width="12" height="12" fill="#8DA242" transform="rotate(45 450 163)"/>
  <rect x="447.5" y="160.5" width="5" height="5" fill="#D4AF37" transform="rotate(45 450 163)"/>

  <!-- subtitle -->
  <text x="450" y="200" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" letter-spacing="3" fill="#F3E5AB" opacity="0.92">
    Computer Science Engineer
  </text>
  <text x="450" y="228" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="8" fill="#8DA242">
    WEB  ·  AI  ·  DATA
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
